[package]
name    = "egui-shadcn"
version = "0.1.0"
edition = "2024"
build   = "build.rs"

[dependencies]
egui = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
skrifa = { version = "0.40", features = ["std", "autohint_shaping"] }

[build-dependencies]
ureq = { version = "2", features = ["tls"] }
