[package]
name    = "demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "demo-native"
path = "src/main.rs"

[dependencies]
egui-shadcn = { path = "../egui-shadcn" }
egui        = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe               = { workspace = true, features = ["default_fonts", "glow"] }
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
web-sys              = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window", "Response"] }
js-sys               = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
skrifa            = { version = "0.40", features = ["std", "autohint_shaping"] }

[build-dependencies]
ureq = { version = "2", features = ["tls"] }
