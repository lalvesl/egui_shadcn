[workspace]
members  = [
  "egui_components",
  "egui_sc",
  "demo",
  "i18n/i18n-format",
  "i18n/i18n-macros",
  "i18n/i18n",
  "i18n/example-app",
  "egui_charts/crates/egui_charts",
  "egui_charts/crates/egui_charts_gallery",
]
# `e2e` is its own workspace: keeps its heavy async/browser deps out of this
# lockfile and out of the wasm32 build of `demo`.
exclude = ["e2e"]
resolver = "2"

[workspace.dependencies]
egui   = "0.34"
epaint = "0.34"
eframe = { version = "0.34", default-features = false }
