[workspace]
members = [
  "egui_components",
  "egui_sc",
  "demo",
  "i18n/i18n-format",
  "i18n/i18n-macros",
  "i18n/i18n",
  "i18n/example-app",
  "egui_charts/crates/egui_charts",
  "egui_charts/crates/egui_charts_gallery",
]
# `e2e` is its own workspace: keeps its heavy async/browser deps out of this
# lockfile and out of the wasm32 build of `demo`.
exclude = ["e2e"]
resolver = "2"

[workspace.dependencies]
egui = "0.35"
epaint = "0.35"
eframe = { version = "0.35", default-features = false }

# native-tls, not rustls: this is only the build-time font downloader, and
# rustls drags `ring` into every consumer's build graph (ring 0.17 is the
# crate most likely to break on off-pin toolchains).
ureq = { version = "3.3", default-features = false, features = ["native-tls", "gzip"] }
skrifa = { version = "0.45", features = ["std", "autohint_shaping"] }
js-sys = "0.3"

# Size-tuned release profile. Main target is the wasm32 demo (`nix build .#web`),
# where `wasm-opt -Oz` then shrinks the output further. codegen-units=1 is the
# dominant size lever here (~0.6 MB vs the default 16); opt-level=3 beats "z"/"s"
# for this code because it inlines enough that wasm-opt can DCE more afterwards.
# fat LTO trims a little more, panic="abort" drops unwinding tables, strip removes
# symbol names. Measured smallest of opt∈{3,s,z}×lto∈{off,thin,fat} post-wasm-opt.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
