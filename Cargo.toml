[package]
name = "egui-shadcn"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "egui-shadcn"
path = "src/main.rs"

[dependencies]
egui = "0.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe               = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }

[profile.release]
opt-level     = 'z'
lto           = true
codegen-units = 1
panic         = 'abort'
strip         = true

[profile.wasm-release]
inherits      = "release"
opt-level     = 'z'
