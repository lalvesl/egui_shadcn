# Standalone crate (own [workspace]) so its heavy async deps never enter the
# main workspace lock and are never dragged into the wasm32 build of `demo`.
[package]
name = "e2e"
version = "0.1.0"
edition = "2021"
description = "Headless-browser end-to-end test for the egui-shadcn WASM demo (Rust port of the former Playwright script)."
publish = false

[[bin]]
name = "e2e"
path = "src/main.rs"

[dependencies]
chromiumoxide = { version = "0.7", default-features = false, features = [
  "tokio-runtime",
  "bytes",
] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
  "net",
  "io-util",
  "fs",
] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
serde_json = "1"

[workspace]
