[package]
name = "egui_components"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = ["lang-en-us", "lang-pt-br"]
lang-en = ["i18n/lang-en"]
lang-en-us = ["i18n/lang-en-us"]
lang-pt = ["i18n/lang-pt"]
lang-pt-br = ["i18n/lang-pt-br"]

[dependencies]
egui = { workspace = true }
i18n = { path = "../i18n/i18n" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }

[dev-dependencies]
skrifa = { workspace = true }

[build-dependencies]
ureq = { workspace = true }
